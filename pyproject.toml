[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-cgt-reform"
version = "0.1.0"
description = "Data pipeline and live rate explorer modelling reforms to UK capital gains tax rates, led by their equalisation with income tax rates."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
simulation = [
  # policyengine.py 6.10.0 pins policyengine-uk 2.132.6 and policyengine-core
  # 3.33.3, the versions the Microcosm UK 2024-25 release was built with and
  # is certified for, and refuses any other policyengine-uk. Each engine
  # release can move the projection fingerprint, so a fresh install reproduces
  # the committed results only on these pins; changing them is a deliberate
  # re-pin that regenerates the results (projection fc5e9a879bce on 2.132.6).
  "policyengine[uk]==6.10.0",
  "policyengine-uk==2.132.6",
  "policyengine-core==3.33.3",
  "microdf-python>=1.3,<1.4",
  "pyyaml>=6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
uk-cgt-reform-build = "uk_cgt_reform.cli:main"
uk-cgt-reform-explore = "uk_cgt_reform.explore_cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/uk-cgt-reform"
Repository = "https://github.com/PolicyEngine/uk-cgt-reform"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_cgt_reform"]

[tool.hatch.build.targets.sdist]
include = [
  "src/uk_cgt_reform/**/*.py",
  "tests/**/*.py",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
