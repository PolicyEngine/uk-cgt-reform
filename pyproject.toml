[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-equalising-cgt"
version = "0.1.0"
description = "Data pipeline modelling the equalisation of UK capital gains tax rates with income tax rates (the 'Burnham' reform)."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
simulation = [
  # policyengine.py 5.0.3 onwards certifies the UK bundle against one pinned
  # policyengine-uk (2.90.2 in 6.0.0) and refuses to import with any other
  # version installed; the asset-type CGT schedules need policyengine-uk 2.99.0.
  # policyengine-uk 2.100.x moves the projection fingerprint (1b0cd0dff144 on
  # 2.99.1, cd902bb73930 on 2.100.1), so the upper bound keeps a fresh install
  # reproducing the committed results; raising it is a deliberate re-pin that
  # regenerates every results file.
  "policyengine>=4.20.0,<5",
  "policyengine-uk>=2.99.0,<2.100",
  "microdf-python>=1.0",
  "pyyaml>=6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
uk-equalising-cgt-build = "uk_equalising_cgt.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/uk-equalising-cgt"
Repository = "https://github.com/PolicyEngine/uk-equalising-cgt"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_equalising_cgt"]

[tool.hatch.build.targets.sdist]
include = [
  "src/uk_equalising_cgt/**/*.py",
  "tests/**/*.py",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
